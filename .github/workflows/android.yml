name: Android CI — Slice A scaffold gates

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Toolchain audit (12 modules, pins, minSdk 29 / SDK 35, no minify)
        run: ./scripts/audit-toolchain.sh

      - name: Unit tests (gate)
        run: ./gradlew test

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Gates audit (size <40MB, zero trackers, permission allowlist)
        run: ./scripts/audit-gates.sh
