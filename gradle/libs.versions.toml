# Slice A toolchain pins — single version source (scaffold Req 6, tech-doc §1/§6).
# Media3: latest stable verified at apply time (2026-09-12) via Google Maven
# metadata; pinned IDENTICALLY across every media3 artifact.
[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
hilt = "2.55"
room = "2.6.1"
composeBom = "2024.12.01"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
navigationCompose = "2.8.4"
hiltNavigationCompose = "1.2.0"
media3 = "1.9.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
serialization = "1.8.1"
coroutines = "1.10.1"
junit = "4.13.2"
robolectric = "4.14.1"
turbine = "1.1.0"
mockwebserver = "4.12.0"

[libraries]
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
