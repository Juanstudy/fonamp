<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="470" viewBox="0 0 1200 470"
     role="img" aria-labelledby="title desc">
  <title id="title">fonamp module map</title>
  <desc id="desc">How fonamp is wired: the app shell hosts feature modules for library, radio, and settings, which share provider modules for local, API, and radio sources and core modules for player, network, database, permissions, and UI.</desc>

  <rect width="1200" height="470" rx="26" fill="#0C0F14"/>
  <rect x="1.5" y="1.5" width="1197" height="467" rx="25" fill="none" stroke="#232D3D" stroke-width="2"/>

  <text x="64" y="72" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="40" font-weight="700" fill="#F2F4F8">How it is wired</text>
  <text x="64" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#8B93A3">app &#8594; features &#8594; providers + core</text>

  <!-- app shell -->
  <g>
    <rect x="64" y="140" width="240" height="262" rx="18" fill="#131A24" stroke="#2A3648" stroke-width="2"/>
    <text x="92" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#4ADE80">app</text>
    <text x="92" y="224" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" fill="#C7CDD8">shell &#183; nav</text>
    <text x="92" y="252" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" fill="#C7CDD8">Hilt DI</text>
    <text x="92" y="280" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" fill="#C7CDD8">Media3 session</text>
    <!-- eq motif, quiet -->
    <g fill="#263042">
      <rect x="92" y="330" width="18" height="40" rx="5"/>
      <rect x="118" y="314" width="18" height="56" rx="5"/>
      <rect x="144" y="324" width="18" height="46" rx="5"/>
      <rect x="170" y="306" width="18" height="64" rx="5"/>
    </g>
    <rect x="196" y="330" width="18" height="40" rx="5" fill="#4ADE80"/>
  </g>

  <!-- features -->
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#F2F4F8">
    <rect x="352" y="140" width="288" height="80" rx="18" fill="#1C2534"/>
    <text x="380" y="189">feature:library</text>
    <rect x="352" y="232" width="288" height="80" rx="18" fill="#1C2534"/>
    <text x="380" y="281">feature:radio</text>
    <rect x="352" y="324" width="288" height="80" rx="18" fill="#1C2534"/>
    <text x="380" y="373">feature:settings</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8B93A3">
    <text x="380" y="211">MediaStore tracks</text>
    <text x="380" y="303">stations + curated</text>
    <text x="380" y="395">theme + prefs</text>
  </g>

  <!-- providers -->
  <g>
    <rect x="688" y="140" width="448" height="124" rx="18" fill="#131A24" stroke="#F59E0B" stroke-width="2"/>
    <text x="716" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#F59E0B">provider</text>
    <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" fill="#F2F4F8">
      <rect x="716" y="194" width="88" height="44" rx="10" fill="#1C2534"/><text x="738" y="224">api</text>
      <rect x="816" y="194" width="104" height="44" rx="10" fill="#1C2534"/><text x="832" y="224">radio</text>
      <rect x="932" y="194" width="104" height="44" rx="10" fill="#1C2534"/><text x="950" y="224">local</text>
    </g>
  </g>

  <!-- core -->
  <g>
    <rect x="688" y="276" width="448" height="128" rx="18" fill="#131A24" stroke="#4ADE80" stroke-width="2"/>
    <text x="716" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#4ADE80">core</text>
    <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" fill="#F2F4F8">
      <rect x="716" y="328" width="106" height="44" rx="10" fill="#1C2534"/><text x="730" y="358">player</text>
      <rect x="834" y="328" width="122" height="44" rx="10" fill="#1C2534"/><text x="844" y="358">network</text>
      <rect x="968" y="328" width="140" height="44" rx="10" fill="#1C2534"/><text x="976" y="358">database</text>
    </g>
  </g>
  <text x="688" y="432" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B93A3">core also: permissions &#183; ui (Room, Coil)</text>

  <!-- connectors -->
  <g stroke="#3B475C" stroke-width="3" fill="none">
    <line x1="304" y1="220" x2="352" y2="180"/>
    <line x1="304" y1="271" x2="352" y2="272"/>
    <line x1="304" y1="322" x2="352" y2="364"/>
    <line x1="640" y1="180" x2="688" y2="202"/>
    <line x1="640" y1="272" x2="688" y2="240"/>
    <line x1="640" y1="272" x2="688" y2="340"/>
    <line x1="640" y1="364" x2="688" y2="340"/>
  </g>
  <g fill="#3B475C">
    <circle cx="352" cy="180" r="5"/>
    <circle cx="352" cy="272" r="5"/>
    <circle cx="352" cy="364" r="5"/>
    <circle cx="688" cy="202" r="5"/>
    <circle cx="688" cy="240" r="5"/>
    <circle cx="688" cy="340" r="5"/>
  </g>
</svg>
