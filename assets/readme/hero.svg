<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">fonamp</title>
  <desc id="desc">fonamp: local library plus internet radio in one fast, tiny, tracker-free Android player. Signed release is 7.3 MB with six permissions and no ads or trackers.</desc>

  <defs>
    <linearGradient id="eqfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="26" fill="#0C0F14"/>
  <rect x="1.5" y="1.5" width="1197" height="377" rx="25" fill="none" stroke="#232D3D" stroke-width="2"/>

  <!-- faint staff lines: the motif canvas -->
  <g stroke="#161E2A" stroke-width="2">
    <line x1="64" y1="316" x2="636" y2="316"/>
    <line x1="64" y1="332" x2="636" y2="332"/>
  </g>

  <g id="title-block" transform="translate(64 52)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="3" fill="#4ADE80">NATIVE ANDROID &#183; KOTLIN &#183; COMPOSE</text>
    <text x="-4" y="102" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="88" font-weight="800" fill="#F2F4F8">fonamp</text>
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" fill="#C7CDD8">Local library + internet radio in one</text>
    <text x="0" y="184" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" fill="#C7CDD8">fast, tiny, tracker-free player.</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#0C0F14">
      <rect x="0" y="208" width="272" height="40" rx="20" fill="#4ADE80"/>
      <text x="24" y="235" fill="#0C0F14">7.3 MB signed release</text>
      <rect x="284" y="208" width="172" height="40" rx="20" fill="none" stroke="#4ADE80" stroke-width="2"/>
      <text x="308" y="235" fill="#4ADE80">6 permissions</text>
    </g>
    <text x="0" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B93A3">no ads &#183; no trackers &#183; no Firebase</text>
  </g>

  <g id="project-proof" transform="translate(700 40)">
    <rect width="436" height="300" rx="24" fill="#131A24"/>
    <rect x="1.5" y="1.5" width="433" height="297" rx="23" fill="none" stroke="#2A3648" stroke-width="2"/>
    <text x="28" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="3" fill="#8B93A3">NOW PLAYING</text>
    <text x="28" y="76" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#F2F4F8">Midnight Lofi &#8212; Chill Mix</text>
    <text x="28" y="102" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" fill="#8B93A3">RadioBrowser &#183; 128 kbps</text>
    <!-- equalizer motif -->
    <g fill="url(#eqfade)">
      <rect x="28" y="150" width="26" height="34" rx="6"/>
      <rect x="68" y="132" width="26" height="52" rx="6"/>
      <rect x="108" y="118" width="26" height="66" rx="6"/>
      <rect x="148" y="140" width="26" height="44" rx="6"/>
      <rect x="188" y="124" width="26" height="60" rx="6"/>
      <rect x="228" y="146" width="26" height="38" rx="6"/>
      <rect x="268" y="136" width="26" height="48" rx="6"/>
    </g>
    <circle cx="376" cy="152" r="30" fill="#F59E0B"/>
    <path d="M369 138 L391 152 L369 166 Z" fill="#0C0F14"/>
    <!-- progress -->
    <rect x="28" y="204" width="380" height="8" rx="4" fill="#263042"/>
    <rect x="28" y="204" width="238" height="8" rx="4" fill="#4ADE80"/>
    <!-- curated tiles -->
    <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" fill="#F2F4F8">
      <rect x="28" y="226" width="118" height="48" rx="12" fill="#1C2534"/>
      <text x="46" y="257">Lofi</text>
      <rect x="159" y="226" width="118" height="48" rx="12" fill="#1C2534"/>
      <text x="177" y="257">Chill</text>
      <rect x="290" y="226" width="118" height="48" rx="12" fill="#1C2534"/>
      <text x="298" y="257">Ambient</text>
    </g>
    <g fill="#4ADE80">
      <circle cx="126" cy="250" r="4"/>
      <circle cx="257" cy="250" r="4"/>
      <circle cx="388" cy="250" r="4"/>
    </g>
  </g>
</svg>
